<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="How This Site Was Made — a scrubbable timeline from the Big Bang to Objects In Space." />
  <title>How This Site Was Made · Objects In Space</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=title1" />
  <!-- Cloudflare Web Analytics --><script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "ed4660d74de24898991981cdb05e73b9"}'></script><!-- End Cloudflare Web Analytics -->
</head>
<body class="hsm-page">
  <canvas id="timeline-canvas" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="brand" href="https://dkossin.com/">Objects In Space</a>
    <h1 class="page-title">How This Site Was Made</h1>
  </header>

  <aside id="placard" class="placard" aria-live="off">
    <p class="placard-chapter" id="placard-chapter">Cosmic dawn</p>
    <p class="placard-time" id="placard-time"></p>
    <h2 class="placard-title" id="placard-title"></h2>
    <p class="placard-body" id="placard-body"></p>
  </aside>

  <div id="live" class="sr-only" aria-live="polite"></div>

  <footer class="scrubber" role="region" aria-label="Timeline scrubber">
    <button type="button" id="play-btn" class="play-btn" aria-pressed="false" title="Play or pause auto-advance">Play</button>
    <div class="scrub-wrap">
      <div class="scrub-eras" id="scrub-eras" aria-hidden="true"></div>
      <div
        id="scrub-track"
        class="scrub-track"
        role="slider"
        tabindex="0"
        aria-valuemin="0"
        aria-valuemax="1000"
        aria-valuenow="0"
        aria-label="Cosmic timeline. Use arrow keys to jump between checkpoints."
      >
        <div class="scrub-fill" id="scrub-fill"></div>
        <div class="scrub-ticks" id="scrub-ticks"></div>
        <div class="scrub-thumb" id="scrub-thumb"></div>
      </div>
    </div>
  </footer>

  <script type="module" src="main.js?v=title1"></script>
</body>
</html>
