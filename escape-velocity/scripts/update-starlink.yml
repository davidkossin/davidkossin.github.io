name: Update constellation data

on:
  schedule:
    # Weekly, Mondays 09:40 UTC
    - cron: "40 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-escape-velocity-starlink
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch constellation catalogs and elements
        run: python3 escape-velocity/scripts/fetch_constellations.py

      - name: Commit if changed
        run: |
          files=(
            escape-velocity/data/starlink.json
            escape-velocity/data/amazon-leo.json
            escape-velocity/data/oneweb.json
          )
          if git diff --quiet -- "${files[@]}"; then
            echo "No constellation data changes"
            exit 0
          fi
          ASOF=$(python3 -c 'import json,pathlib; print(", ".join(json.loads(pathlib.Path(p).read_text()).get("asOf","?") + " " + pathlib.Path(p).stem for p in ["escape-velocity/data/starlink.json","escape-velocity/data/amazon-leo.json","escape-velocity/data/oneweb.json"] if pathlib.Path(p).exists()))')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "Update constellation data (${ASOF})"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 10
          done
          exit 1
