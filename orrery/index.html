<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="The Orrery — a top-down model of the solar system showing the planets at their real positions today." />
  <title>The Orrery · Objects In Space</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://dkossin.com/styles.css" />
  <link rel="stylesheet" href="orrery.css" />
  <script src="orrery.js" defer></script>
  <!-- Cloudflare Web Analytics --><script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "ed4660d74de24898991981cdb05e73b9"}'></script><!-- End Cloudflare Web Analytics -->
</head>
<body class="orrery-page">
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="nebula" aria-hidden="true"></div>
  <canvas id="orrery" aria-label="Top-down orrery of the solar system" tabindex="-1"></canvas>

  <header class="topbar">
    <a class="brand" href="https://dkossin.com/">Objects In Space</a>
    <nav>
      <a href="https://dkossin.com/">Home</a>
      <a class="active" href="./">Orrery</a>
    </nav>
  </header>

  <section class="heading" id="heading">
    <h1>The Orrery</h1>
    <p class="clock" id="clock" aria-live="off">&nbsp;</p>
  </section>

  <div class="controls" id="controls">
    <div class="viewmode">
      <span class="vm-label" id="vmLabel">View Mode</span>
      <div class="seg" id="viewMode" role="radiogroup" aria-labelledby="vmLabel">
        <button type="button" role="radio" aria-checked="true" data-view="orrery">Orrery</button>
        <button type="button" role="radio" aria-checked="false" tabindex="-1" data-view="cartographic">Cartographic</button>
      </div>
    </div>
    <button class="switch" id="scaleSwitch" type="button" role="switch" aria-checked="false">
      <span class="track"><span class="thumb"></span></span>
      <span class="switch-label">To Scale</span>
    </button>
  </div>

  <div class="zoomctl" id="zoomctl">
    <button type="button" id="zin" aria-label="Zoom in">+</button>
    <button type="button" id="zout" aria-label="Zoom out">&minus;</button>
    <button type="button" id="zfit" aria-label="Reset zoom">Fit</button>
  </div>

  <button class="back" id="back" type="button" hidden>&larr; Back to solar system</button>

  <nav class="planet-list" aria-label="Planets" id="planetList"></nav>

  <aside class="panel" id="panel" aria-label="Planet information" hidden></aside>
  <div class="moon-card" id="moonCard" hidden></div>
  <div class="tip" id="tip" hidden></div>

  <div class="timebox" id="timebox">
    <div class="tb-ends"><span>Present</span><span>+100 Years</span></div>
    <input type="range" id="timeSlider" min="0" max="36525" step="1" value="0" aria-label="Time projection, from present to plus 100 years" aria-valuetext="Present" />
    <div class="tb-date" id="tbDate" aria-live="off">Present</div>
  </div>

  <footer class="key" id="key">
    <div class="key-bar" id="keyBar"><span class="bar-line" id="barLine"></span><span class="bar-label" id="barLabel"></span></div>
    <div class="key-text" id="keyText"></div>
  </footer>

  <script src="https://dkossin.com/stars.js"></script>
</body>
</html>
